version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: govcomm_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-govcomm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_DB: ${DB_NAME:-govcomm_db}
    ports:
      - "5432:5432"
    networks:
      - govcomm_internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-govcomm_user} -d ${DB_NAME:-govcomm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: govcomm_backend
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-govcomm_user}
      DB_PASSWORD: ${DB_PASSWORD:-secure_password}
      DB_NAME: ${DB_NAME:-govcomm_db}
      DB_PORT: 5432
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-jwt_secret_key}
      GEO_FENCE_ENABLED: ${GEO_FENCE_ENABLED}
      GEO_FENCE_COUNTRY: ${GEO_FENCE_COUNTRY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - govcomm_internal

networks:
  govcomm_internal:
    driver: bridge

volumes:
  postgres_data: {}
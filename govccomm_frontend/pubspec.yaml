name: govccomm_secure
description: Government Secure Messaging Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  socket_io_client: ^2.0.3
  cryptography: ^2.7.0
  sqflite: ^2.3.0
  path: ^1.9.0
  jwt_decoder: ^2.0.1
  libsignal_protocol_dart: ^0.7.4
  path_provider: ^2.1.1     
  file_picker: ^8.0.1     
  mime_type: ^1.0.0         
  audioplayers: ^5.2.1
  record: ^6.2.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpeg
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpeg"
  min_sdk_android: 21